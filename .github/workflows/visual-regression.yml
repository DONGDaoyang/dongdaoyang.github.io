name: Hub browser checks

on:
  pull_request:
    branches: [main, master]
    paths:
      - "_config.yml"
      - "_data/**"
      - "_bibliography/**"
      - "_pages/**"
      - "_projects/**"
      - "assets/**"
      - "test/visual/**"
      - ".github/workflows/visual-regression.yml"
      - "package.json"
      - "package-lock.json"
      - "Gemfile"
      - "Gemfile.lock"
  workflow_dispatch:

jobs:
  hub-browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS dependencies
        run: npm ci
      - name: Install image build prerequisites
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Check Hub routes, navigation, case structure, and images
        run: npm run test:visual
      - name: Upload browser reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hub-browser-results
          path: test-results/
          retention-days: 7
