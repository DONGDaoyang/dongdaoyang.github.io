welcome: |
  **Howdy! Welcome to Residual Stress Hub.**

  Residual Stress Hub focuses on residual stress simulation across a wide range of metal additive manufacturing and repair processes. The current emphasis is on inherent strain methods based on differentiable finite element analysis.

  Explore benchmark cases, simulation methods, and research data, and join the discussion on modeling assumptions and results.
