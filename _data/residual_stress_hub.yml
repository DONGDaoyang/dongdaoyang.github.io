# Shared hub content. Publish only verified case studies and research outputs.
name: Residual Stress Hub
tagline: Cases, methods & research resources.
intro: A focused home for residual stress research, with an initial emphasis on metal additive manufacturing and computational modeling.
status: Independent research resource · Initial release
scope:
  - number: "01"
    title: Cases
    description: Explore a research problem through its specification, method, figures, and evidence.
    url: /projects/
    action: Browse the case library
  - number: "02"
    title: Methods
    description: A practical reporting guide for documenting assumptions, numerical settings, and comparisons.
    url: /methods/
    action: Read the reporting guide
  - number: "03"
    title: Resources
    description: Follow original sources for benchmark information and research materials.
    url: /resources/
    action: Explore the resources
case_fields:
  - title: Problem specification
    detail: State the research question, geometry, material, process, and intended output. Explain the scope and what is not modeled.
  - title: Model & assumptions
    detail: Document model equations, material inputs, boundary conditions, software, and numerical settings. Identify simplifications.
  - title: Results & comparison
    detail: Include labeled figures, stress components, coordinate conventions, units, and comparison conditions. State limitations alongside conclusions.
  - title: Reproducibility & sources
    detail: Link supporting papers and available files. Record versions, licenses, and access restrictions; distinguish public resources from unavailable materials.
resources:
  - type: EXTERNAL BENCHMARK RESOURCE
    title: NIST AM-Bench
    description: Original source for additive manufacturing benchmark measurements, challenge problems, and published datasets. Check each problem's documentation before choosing a comparison.
    url: https://www.nist.gov/ambench
    source: National Institute of Standards and Technology
  - type: SITE DESIGN REFERENCE
    title: PFHub
    description: The Phase Field Community Hub. An information-architecture reference for this site, not a residual stress dataset or a partner of this Hub.
    url: https://pages.nist.gov/pfhub/
    source: PFHub · NIST-hosted website
# Add real papers only. Required fields: title, citation, url.
publications: []
